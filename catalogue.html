<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floris - Каталог</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="container header-inner">
            <a href="index.html" class="logo">FLORIS</a>
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="menu-icon">&#9776;</label>

            <nav>
                <ul>
                    <li><a href="index.html">MAIN</a></li>
                    <li><a href="catalogue.html">CATALOGUE</a></li>
                    <li><a href="about.html">ABOUT</a></li>
                    <li><a href="delivery.html">DELIVERY</a></li>
                    <li><a href="contacts.html">CONTACTS</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="toolbar">
            <form class="search-box">
                <input type="text" placeholder="SEARCH FLOWERS...">
                <button type="submit">🔍</button>
            </form>

            <div class="sort-box">
                <select>
                    <option value="" disabled selected>SORT BY</option>
                    <option value="cheap">CHEAPEST FIRST</option>
                    <option value="expensive">MOST EXPENSIVE</option>
                    <option value="popular">POPULARITY</option>
                </select>
            </div>
        </div>

        <div class="product-grid">
            <div class="product-card">
                <img src="images/p1.png" alt="101 Rose">
                <h4>101 ROSE</h4>
                <button class="btn">3200₴</button>
            </div>
            <div class="product-card">
                <img src="images/p2.png" alt="Tulips">
                <h4>TULIPS</h4>
                <button class="btn">880₴</button>
            </div>
            <div class="product-card">
                <img src="images/p3.png" alt="Softness">
                <h4>"SOFTNESS"</h4>
                <button class="btn">1100₴</button>
            </div>
            <div class="product-card">
                <img src="images/p4.png" alt="Hydrangea">
                <h4>HYDRANGEA BLUE</h4>
                <button class="btn">450₴</button>
            </div>
            <div class="product-card">
                <img src="images/p5.png" alt="Peonies">
                <h4>PEONIES</h4>
                <button class="btn">1500₴</button>
            </div>
            <div class="product-card">
                <img src="images/p6.png" alt="Spring Mix">
                <h4>SPRING MIX</h4>
                <button class="btn">900₴</button>
            </div>
            <div class="product-card">
                <img src="images/p7.png" alt="Calathea">
                <h4>CALATHEA</h4>
                <button class="btn">450₴</button>
            </div>
            <div class="product-card">
                <img src="images/p8.png" alt="Azalea">
                <h4>AZALEA</h4>
                <button class="btn">600₴</button>
            </div>
            <div class="product-card">
                <img src="images/p9.png" alt="Violet">
                <h4>VIOLET</h4>
                <button class="btn">400₴</button>
            </div>
        </div>
    </div>

    <footer>© 2026 FLORIS. FLOWERS WITH A SOUL.</footer>
</body>

</html>
